apiVersion: agentprovider/v1
kind: Resource
type: aap_job
connection:
  base_url: "${env.AWX}"
  allow_insecure: true
  allow_private_host: true
  auth:
    type: basic
    username: "${env.AWX_USERNAME}"
    password: "${env.AWX_PASSWORD}"
schema:
  attributes:
    template_id:
      type: number
      required: true
    job_id:
      type: number
      computed: true
      field: id
    status:
      type: string
      computed: true
    job_template:
      type: number
      computed: true
actions:
  launch:
    method: POST
    path: /api/v2/job_templates/${template_id}/launch/
    expect_status: [201]
conformance:
  action: launch
  example:
    template_id: 177
    job_template: 177
    status: pending
  expect:
    job_id: { not_null: true }
  invariants:
    - action_returns_expected
    - state_matches_expect
