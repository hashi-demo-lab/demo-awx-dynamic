apiVersion: agentprovider/v1
kind: Resource
type: aap_workflow_job
connection:
  base_url: "${env.AWX}"
  allow_insecure: true
  allow_private_host: true
  auth:
    type: basic
    username: "${env.AWX_USERNAME}"
    password: "${env.AWX_PASSWORD}"
schema:
  attributes:
    workflow_job_template_id:
      type: number
      required: true
    workflow_job_id:
      type: number
      computed: true
      field: id
    status:
      type: string
      computed: true
    workflow_job_template:
      type: number
      computed: true
actions:
  launch:
    method: POST
    path: /api/v2/workflow_job_templates/${workflow_job_template_id}/launch/
    expect_status: [201]
conformance:
  action: launch
  example:
    workflow_job_template_id: 176
    status: pending
    workflow_job_template: 176
  expect:
    workflow_job_id: { not_null: true }
  invariants:
    - action_returns_expected
    - state_matches_expect
